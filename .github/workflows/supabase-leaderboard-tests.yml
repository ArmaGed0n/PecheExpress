name: Supabase leaderboard checks

on:
  pull_request:
    paths:
      - "supabase/functions/**"
      - "supabase/config.toml"
      - ".github/workflows/supabase-leaderboard-tests.yml"
  push:
    branches: [main]
    paths:
      - "supabase/functions/**"
      - "supabase/config.toml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Run leaderboard unit tests
        run: deno test supabase/functions/tests
      - name: Type-check the Edge Function
        run: deno check supabase/functions/leaderboard/index.ts
